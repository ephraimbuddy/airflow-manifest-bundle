[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-manifest-bundle"
version = "0.3.0"
description = "Manifest-backed Dag bundles for Apache Airflow with immutable, content-addressed snapshots and reproducible pinned execution."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ephraim Anierobi", email = "ephraim@astronomer.io" }]
keywords = ["airflow", "dag", "bundle", "deployment", "content-addressed", "manifest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Apache Airflow",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # The bundle uses fcntl file locks, so it is POSIX-only (like Airflow itself).
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # Needs the AIP-66 Dag-bundle APIs (BaseDagBundle.versions_dir, version pinning
    # via BundleVersionLock, usage tracking), all available since Airflow 3.0.0.
    "apache-airflow>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ephraimbuddy/airflow-manifest-bundle"
Repository = "https://github.com/ephraimbuddy/airflow-manifest-bundle"
Issues = "https://github.com/ephraimbuddy/airflow-manifest-bundle/issues"

[project.scripts]
airflow-manifest-bundle = "airflow_manifest_bundle.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
gcs = ["apache-airflow-providers-google>=18.1.0"]
s3 = ["apache-airflow-providers-amazon>=9.10.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_manifest_bundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.16.0"

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py311"
