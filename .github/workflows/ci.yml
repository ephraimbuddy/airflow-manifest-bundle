name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff==0.16.0 check src tests scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported combination.
          - python-version: "3.10"
            airflow-version: "3.1.8"
          # Current Airflow release.
          - python-version: "3.12"
            airflow-version: "3.3.0"
    name: tests (py${{ matrix.python-version }}, airflow ${{ matrix.airflow-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the package with Airflow
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install "apache-airflow==${{ matrix.airflow-version }}" pytest .
      # No PYTHONPATH: the tests run against the installed copy of the package.
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
